<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Water Quality Risk Analyzer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/validation.js" defer></script>
</head>
<body>
    <main class="page-container">
        <section class="form-card" aria-labelledby="login-title">
            <a class="brand" href="index.html">Water Quality Risk Analyzer</a>
            <h1 id="login-title">Welcome back</h1>
            <p class="form-description">Enter your account details to continue.</p>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" autocomplete="username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Enter password">
                </div>
                <p id="login-message" class="form-message" role="alert" aria-live="polite"></p>
                <button type="submit" class="button">Login</button>
            </form>

            <p class="switch-page">New user? <a href="register.html">Create an account</a></p>
        </section>
    </main>
</body>
</html>
